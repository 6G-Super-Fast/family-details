<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAMILY DETAILS PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; user-select: none; }
        html, body {
            background: #f9ca24 !important;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            margin: 0 !important;
            padding: 0 !important;
            width: 100vw !important;
            min-height: 100vh !important;
            font-family: 'Poppins', 'Segoe UI', sans-serif !important;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #000; border-radius: 10px; }
        #panFinderCard {
            max-width: 650px; /* Yahan width aur badha di hai */
            width: 95%;
            padding: 30px 25px 25px 25px;
            background: #f9ca24;
            border: 2px solid #000000;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: grab;
            margin: 40px 0; 
            display: flex;
            flex-direction: column;
        }
        .badge {
            display: inline-block;
            background: transparent;
            color: #000;
            border: 2px solid #000;
            font-size: 12px;
            font-weight: 800;
            padding: 5px 18px;
            border-radius: 30px;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
        }
        h2 { font-size: 24px; font-weight: 800; color: #000; margin: 0 0 4px 0; }
        .subtitle { font-size: 14px; color: #000; margin: 0 0 20px 0; font-weight: 500; opacity: 0.8; }
        .form-group { margin-bottom: 15px; text-align: left; width: 100%; }
        label { display: block; font-size: 14px; font-weight: 600; color: #000; margin-bottom: 6px; }
        input[type="text"] {
            background: transparent;
            border: 2px solid #000;
            color: #000;
            padding: 12px 16px;
            font-size: 18px;
            border-radius: 10px;
            width: 100%;
            font-weight: 600;
            outline: none;
            cursor: text;
            user-select: text;
            text-transform: uppercase;
        }
        .btn-main {
            background: transparent;
            color: #000;
            border: 2px solid #000;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px 0 15px 0;
            font-family: inherit;
        }
        .btn-main:hover { background: #000; color: #f9ca24; }
        .result-wrapper { 
            width: 100%; 
        }
        #fakeResultDiv {
            background: transparent;
            border: 2px solid #000;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.6;
            color: #000;
            min-height: 50px;
            height: auto; 
            text-align: left;
            user-select: text;
            word-break: break-word;
        }
        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            margin-top: 15px;
        }
        .btn-sub {
            flex: 1;
            background: transparent;
            color: #000;
            border: 2px solid #000;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
        }
    </style>
</head>
<body>

    <div id="panFinderCard">
        <div class="badge">👑 VIP ACCESS</div>
        <h2>📄 FAMILY DETAILS</h2>
        <p class="subtitle">Instantly check Ration Card & Members</p>

        <form id="checkForm" onsubmit="event.preventDefault();">
            <div class="form-group">
                <label for="uidInput">Aadhaar Number</label>
                <input type="text" id="uidInput" maxlength="12" autocomplete="off">
            </div>

            <button type="submit" id="checkBtn" class="btn-main">CHECK RATION DETAILS</button>
        </form>

        <div class="result-wrapper">
            <div id="fakeResultDiv"></div>
        </div>

        <div class="btn-group">
            <button type="button" id="copyBtn" class="btn-sub">📋 COPY TEXT</button>
            <button type="button" id="resetBtn" class="btn-sub">🔄 RESET</button>
        </div>
    </div>

    <script>
        const card = document.getElementById('panFinderCard');
        const uidInput = document.getElementById('uidInput');
        const checkBtn = document.getElementById('checkBtn');
        const fakeResultDiv = document.getElementById('fakeResultDiv');
        const copyBtn = document.getElementById('copyBtn');
        const resetBtn = document.getElementById('resetBtn');

        window.formattedCopyText = "";

        [uidInput, checkBtn, fakeResultDiv, copyBtn, resetBtn].forEach(el => {
            el.addEventListener('mousedown', (e) => e.stopPropagation());
        });

        const savedX = localStorage.getItem('rationCardX');
        const savedY = localStorage.getItem('rationCardY');
        if (savedX !== null && savedY !== null) {
            card.style.left = savedX + 'px';
            card.style.top = savedY + 'px';
            card.style.transform = 'none';
        }

        let isDragging = false, offsetX, offsetY;
        card.addEventListener('mousedown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target === fakeResultDiv) return;
            isDragging = true;
            const rect = card.getBoundingClientRect();
            if (card.style.transform !== 'none') {
                card.style.transform = 'none';
                card.style.left = rect.left + 'px';
                card.style.top = rect.top + 'px';
            }
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            card.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            card.style.left = (e.clientX - offsetX) + 'px';
            card.style.top = (e.clientY - offsetY) + 'px';
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                card.style.cursor = 'grab';
                const rect = card.getBoundingClientRect();
                localStorage.setItem('rationCardX', rect.left);
                localStorage.setItem('rationCardY', rect.top);
            }
        });

        async function fetchStatus(queryStr) {
            const url = `https://admin.gbssystems.com/public/api/v1/api.php?key=8AF6N&cmd=family&query=${queryStr}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error("HTTP error: " + res.status);
            return await res.json();
        }

        const emojis = ['1️⃣', '2️⃣', '3️⃣', '4️⃣', '5️⃣', '6️⃣', '7️⃣', '8️⃣', '9️⃣', '🔟'];

        checkBtn.addEventListener('click', async () => {
            const uidVal = uidInput.value.trim();

            if (uidVal.length !== 12 || isNaN(uidVal)) {
                fakeResultDiv.innerText = 'Enter a valid 12-digit number';
                return;
            }

            fakeResultDiv.innerText = 'Fetching family details...';
            window.formattedCopyText = ""; 

            try {
                const response = await fetchStatus(uidVal);

                if (response && response.success === true && response.details && response.details.pd) {
                    const aadhaar = response.aadhaar;
                    const rcNo = response.rationCardNumber;
                    const pd = response.details.pd;
                    
                    let displayHTML = `📄 <b>Ration Card Details</b> 📄<br><br>`;
                    displayHTML += `🆔 Ration Card No: ${rcNo}<br>`;
                    displayHTML += `🆔 Aadhaar No: ${aadhaar}<br>`;
                    displayHTML += `📋 Scheme: ${pd.schemeName}<br>`;
                    displayHTML += `🏛️ State: ${pd.homeStateName}<br>`;
                    displayHTML += `📍 District: ${pd.homeDistName}<br>`;
                    displayHTML += `🏠 Address: ${pd.address}<br>`;
                    displayHTML += `🏪 FPS ID: ${pd.fpsId}<br>`;
                    displayHTML += `🌍 ONORC Allowed: ${pd.allowed_onorc} ✅<br><br>`;
                    displayHTML += `👨‍👩‍👦 <b>Family Members Details:</b><br><br>`;

                    let copyText = `📄 Ration Card Details 📄\n\n`;
                    copyText += `🆔 Ration Card No: ${rcNo}\n`;
                    copyText += `🆔 Aadhaar No: ${aadhaar}\n`;
                    copyText += `📋 Scheme: ${pd.schemeName}\n`;
                    copyText += `🏛️ State: ${pd.homeStateName}\n`;
                    copyText += `📍 District: ${pd.homeDistName}\n`;
                    copyText += `🏠 Address: ${pd.address}\n`;
                    copyText += `🏪 FPS ID: ${pd.fpsId}\n`;
                    copyText += `🌍 ONORC Allowed: ${pd.allowed_onorc} ✅\n\n`;
                    copyText += `👨‍👩‍👦 Family Members Details:\n\n`;

                    if (pd.memberDetailsList && pd.memberDetailsList.length > 0) {
                        pd.memberDetailsList.forEach((member, index) => {
                            const emoji = index < 10 ? emojis[index] : `${index + 1}️⃣`;
                            
                            displayHTML += `${emoji} <b>${member.memberName}</b><br>`;
                            displayHTML += `- Relation: ${member.releationship_name}<br>`;
                            displayHTML += `- UID Linked: ${member.uid}<br><br>`;

                            copyText += `${emoji} ${member.memberName}\n`;
                            copyText += `- Relation: ${member.releationship_name}\n`;
                            copyText += `- UID Linked: ${member.uid}\n\n`;
                        });
                    } else {
                        displayHTML += `No members found.`;
                        copyText += `No members found.`;
                    }

                    fakeResultDiv.innerHTML = displayHTML;
                    window.formattedCopyText = copyText.trim();

                } else {
                    fakeResultDiv.innerText = 'DETAILS NOT FOUND ❌';
                }
            } catch (err) {
                console.error(err);
                fakeResultDiv.innerText = 'ERROR 404 BYE BYE...';
            }
        });

        function copyTextToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text);
            } else {
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.style.position = "fixed";
                ta.style.left = "-999999px";
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                return new Promise((res, rej) => {
                    document.execCommand('copy') ? res() : rej();
                    ta.remove();
                });
            }
        }

        copyBtn.onclick = async () => {
            if (!window.formattedCopyText) return;

            try {
                await copyTextToClipboard(window.formattedCopyText);
                copyBtn.textContent = '✅ COPIED!';
                copyBtn.style.background = '#27ae60';
                copyBtn.style.color = '#fff';
                copyBtn.style.borderColor = '#27ae60';
                setTimeout(() => {
                    copyBtn.textContent = '📋 COPY TEXT';
                    copyBtn.style.background = 'transparent';
                    copyBtn.style.color = '#000';
                    copyBtn.style.borderColor = '#000';
                }, 1500);
            } catch (e) {
                console.error("Copy failed:", e);
            }
        };

        resetBtn.onclick = () => {
            uidInput.value = '';
            fakeResultDiv.innerHTML = '';
            window.formattedCopyText = '';
            localStorage.removeItem('rationCardX');
            localStorage.removeItem('rationCardY');
            card.style.transform = 'translate(-50%, -50%)';
            card.style.top = '50%';
            card.style.left = '50%';
        };
    </script>
</body>
</html>
